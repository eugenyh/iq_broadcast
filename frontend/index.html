<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Генератор тестовых РЧ сигналов (КВ)</title>
<style>
  :root {
    --bg: #030a03;
    --panel-bg: #050f05;
    --fg: #33ff66;
    --fg-bright: #7dffa0;
    --fg-dim: #1f9945;
    --fg-muted: #0f5a26;
    --border: #145c28;
    --border-bright: #2ea852;
    --danger: #ff3b3b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { height: 100%; margin: 0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:"Consolas", "Courier New", monospace;
    padding:16px; display:flex; flex-direction:column; overflow:hidden;
  }
  h1 {
    font-size:20px; font-weight:700; color:var(--fg-bright); margin:0; flex:0 0 auto;
    letter-spacing:1.5px; text-transform:uppercase;
    text-shadow: 0 0 6px rgba(51,255,102,0.55);
  }

  .page-header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px; flex:0 0 auto;
  }

  button.small-btn {
    background:#020602; color:var(--fg-dim); border:1px solid var(--border); border-radius:2px;
    padding:8px 14px; font-size:12px; font-family:inherit; font-weight:700;
    letter-spacing:0.5px; text-transform:uppercase; white-space:nowrap;
  }
  button.small-btn:hover:not(:disabled) { color:var(--fg-bright); border-color:var(--fg); }
  button.small-btn:disabled { opacity:0.35; cursor:not-allowed; }
  button.small-btn:active:not(:disabled) { transform:scale(0.96); }

  .import-status {
    font-size:12px; color:var(--fg-dim); min-height:16px; margin-bottom:10px; flex:0 0 auto;
  }
  .import-status.error { color:var(--danger); }
  .import-status.ok { color:var(--fg-bright); }

  .select-row { display:flex; gap:8px; }
  .select-row select { flex:1; }
  .select-row .small-btn { flex:0 0 auto; }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.8);
    display:flex; align-items:center; justify-content:center; z-index:100;
  }
  .modal-overlay.hidden { display:none; }
  .modal-box {
    background:var(--panel-bg); border:1px solid var(--border-bright); border-radius:2px;
    padding:16px; width:min(90vw, 1040px); box-shadow:0 0 24px rgba(51,255,102,0.2);
  }
  .modal-header {
    display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;
  }
  .modal-header span {
    color:var(--fg-bright); font-size:14px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase; text-shadow:0 0 6px rgba(51,255,102,0.5);
  }
  button.modal-close {
    background:none; border:1px solid var(--border); color:var(--fg-dim);
    border-radius:2px; width:32px; height:32px; font-size:18px; line-height:1; cursor:pointer;
  }
  button.modal-close:hover { color:var(--fg-bright); border-color:var(--fg); }
  button.modal-close:disabled { opacity:0.3; cursor:not-allowed; }

  .browse-list.locked { pointer-events:none; opacity:0.4; }

  .browse-box { width:min(90vw, 680px); }
  .browse-path {
    font-size:12px; color:var(--fg-dim); margin-bottom:10px; word-break:break-all;
    padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .browse-list { max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .browse-item {
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1px solid transparent; border-radius:2px; cursor:pointer; font-size:14px;
  }
  .browse-item:hover { border-color:var(--border); background:#020602; }
  .browse-item .icon { color:var(--fg-dim); width:18px; text-align:center; flex:0 0 auto; }
  .browse-item.dir .icon { color:var(--fg); }
  .browse-item.tar .name { color:var(--fg-bright); }
  .browse-item .size { margin-left:auto; color:var(--fg-dim); font-size:11px; flex:0 0 auto; }

  .layout { display:flex; gap:20px; flex:1 1 auto; min-height:0; }
  .panel-left { flex:0 0 440px; display:flex; flex-direction:column; gap:14px; min-height:0; overflow-y:auto; }
  .panel-right { flex:1 1 auto; display:flex; flex-direction:column; gap:12px; min-height:0; }

  label.field-label {
    font-size:12px; color:var(--fg-dim); margin-bottom:6px; display:block;
    letter-spacing:0.5px; text-transform:uppercase;
  }

  select, input[type="number"] {
    width:100%; background:#020602; color:var(--fg); border:1px solid var(--border);
    border-radius:2px; padding:14px 16px; font-size:16px; font-family:inherit;
  }
  select:focus, input[type="number"]:focus {
    outline:none; border-color:var(--fg); box-shadow:0 0 6px rgba(51,255,102,0.35);
  }
  select:disabled, input[type="number"]:disabled {
    opacity:0.35; cursor:not-allowed; border-color:var(--fg-muted);
  }
  .panel-left div:has(select:disabled) .field-label,
  .panel-left div:has(input:disabled) .field-label { opacity:0.35; }

  .row-2col { display:flex; gap:14px; align-items:flex-end; }
  .row-2col > div { flex:1; }
  .amp-toggle-wrap { flex:0 0 auto; }

  .switch { display:inline-block; cursor:pointer; }
  .switch input { display:none; }
  .switch-track {
    display:block; width:56px; height:32px; background:#020602;
    border:1px solid var(--border); border-radius:2px; position:relative;
    transition:background .15s, border-color .15s;
  }
  .switch-thumb {
    position:absolute; top:3px; left:3px; width:22px; height:22px;
    background:var(--fg-muted); border-radius:1px; transition:transform .15s, background .15s;
  }
  .switch input:checked + .switch-track { border-color:var(--fg); box-shadow:0 0 6px rgba(51,255,102,0.35); }
  .switch input:checked + .switch-track .switch-thumb { transform:translateX(24px); background:var(--fg); }
  .switch input:disabled + .switch-track { opacity:0.35; cursor:not-allowed; }
  .switch:has(input:disabled) { cursor:not-allowed; }

  .details-card {
    background:var(--panel-bg); border:1px solid var(--border); border-radius:2px;
    padding:10px 14px;
  }
  .details-card .empty { color:var(--fg-muted); font-size:14px; }
  .details-row {
    display:flex; justify-content:space-between; gap:12px;
    padding:4px 0; border-bottom:1px solid var(--border); font-size:12px;
  }
  .details-row:last-child { border-bottom:none; }
  .details-row .label { color:var(--fg-dim); text-transform:uppercase; letter-spacing:0.5px; font-size:10px; }
  .details-row .value { color:var(--fg); text-align:right; }
  .details-desc {
    margin-top:6px; padding-top:6px; border-top:1px solid var(--border);
    font-size:12px; color:var(--fg-dim); line-height:1.5;
  }

  .progress-wrap { display:none; flex-direction:column; gap:5px; }
  .progress-wrap.visible { display:flex; }
  .progress-track {
    width:100%; height:8px; background:#020602; border:1px solid var(--border);
    border-radius:2px; overflow:hidden;
  }
  .progress-fill {
    height:100%; width:0%; background:var(--fg);
    box-shadow:0 0 8px rgba(51,255,102,0.6);
    transition:width 0.3s linear;
  }
  .progress-labels {
    display:flex; justify-content:space-between; font-size:11px;
    color:var(--fg-dim); letter-spacing:0.3px;
  }

  .buttons { display:flex; gap:12px; margin-top:auto; }
  button.big {
    flex:1; background:#020602; color:var(--fg); border:1px solid var(--border); border-radius:2px;
    padding:16px; font-size:17px; font-weight:700; font-family:inherit;
    letter-spacing:1px; text-transform:uppercase;
  }
  button.big:active { transform: scale(0.97); }
  button.big:disabled { opacity:0.35; }
  button.play:not(:disabled) { border-color:var(--fg); color:var(--fg-bright); box-shadow:0 0 8px rgba(51,255,102,0.3); }
  button.stop:not(:disabled) { border-color:var(--danger); color:#ff8080; box-shadow:0 0 8px rgba(255,59,59,0.3); }

  #status {
    font-size:13px; color:var(--fg-dim); min-height:20px;
    letter-spacing:0.3px;
  }
  #status.error { color:var(--danger); }

  canvas { background:#010401; border:1px solid var(--border); border-radius:2px; width:100%; display:block; }
  #spectrum { flex:0 0 55%; }
  #waterfall { flex:1 1 auto; min-height:0; }

  @media (max-width: 820px) {
    .layout { flex-direction:column; overflow-y:auto; }
    .panel-left { flex:0 0 auto; overflow-y:visible; }
    .panel-right { flex:0 0 auto; }
    #spectrum { flex:0 0 220px; }
    #waterfall { flex:0 0 180px; }
  }
</style>
</head>
<body>
<div class="page-header">
  <h1>Генератор тестовых РЧ сигналов (КВ)</h1>
  <div style="display:flex; gap:10px;">
    <button id="import-local-btn" class="small-btn">+ Импорт</button>
  </div>
</div>

<div class="layout">
  <div class="panel-left">
    <div>
      <label class="field-label" for="signal-select">Сигнал</label>
      <div class="select-row">
        <select id="signal-select"></select>
        <button id="preview-btn" class="small-btn" disabled>Предпросмотр</button>
      </div>
    </div>

    <div id="details" class="details-card">
      <span class="empty">Выберите сигнал из списка</span>
    </div>

    <div>
      <label class="field-label" for="freq-input">Частота передачи, МГц</label>
      <input type="number" id="freq-input" step="0.001" min="1" max="6000">
    </div>

    <div>
      <label class="field-label" for="gain-input">TX VGA gain, дБ (0–47)</label>
      <input type="number" id="gain-input" step="1" min="0" max="47">
    </div>

    <div class="row-2col">
      <div class="amp-toggle-wrap">
        <label class="field-label" for="amp-toggle">Усилитель (+14 дБ)</label>
        <label class="switch">
          <input type="checkbox" id="amp-toggle">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>
      <div class="amp-toggle-wrap">
        <label class="field-label" for="loop-toggle">Зациклить</label>
        <label class="switch">
          <input type="checkbox" id="loop-toggle">
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
      </div>
    </div>

    <div id="status">Готов.</div>

    <div id="progress-wrap" class="progress-wrap">
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-labels">
        <span id="progress-time">0:00 / 0:00</span>
        <span id="progress-cycle"></span>
      </div>
    </div>

    <div class="buttons">
      <button id="play-btn" class="big play" disabled>Старт</button>
      <button id="stop-btn" class="big stop" disabled>Стоп</button>
    </div>
  </div>

  <div class="panel-right">
    <canvas id="spectrum" width="1200" height="400"></canvas>
    <canvas id="waterfall" width="1200" height="400"></canvas>
  </div>
</div>

<div id="preview-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span id="preview-title">ПРЕДПРОСМОТР</span>
      <button id="preview-close-btn" class="modal-close">×</button>
    </div>
    <canvas id="preview-canvas" width="1000" height="500"></canvas>
  </div>
</div>

<div id="browse-modal" class="modal-overlay hidden">
  <div class="modal-box browse-box">
    <div class="modal-header">
      <span>Импорт с диска — выберите .tar</span>
      <button id="browse-close-btn" class="modal-close">×</button>
    </div>
    <div id="browse-path" class="browse-path"></div>
    <div id="browse-list" class="browse-list"></div>

    <div id="import-progress-wrap" class="progress-wrap">
      <div class="progress-track">
        <div id="import-progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-labels">
        <span id="import-progress-step">—</span>
        <span id="import-progress-count"></span>
      </div>
    </div>

    <div id="browse-status" class="import-status"></div>
  </div>
</div>

<script>
let signals = [];
let selectedSignal = null;
let ws = null;
let statusPoll = null;

async function loadSignals() {
  const res = await fetch("/signals");
  signals = await res.json();
  const select = document.getElementById("signal-select");
  select.innerHTML = "";
  signals.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = s.name;
    select.appendChild(opt);
  });
  select.onchange = () => selectSignal(select.value);
  if (signals.length > 0) selectSignal(signals[0].id);
}

function fmtFreqMHz(hz) {
  return (hz / 1e6).toFixed(6).replace(/0+$/, "").replace(/\.$/, "");
}

function buildSpecRows(s) {
  const rows = [];
  const addRow = (label, value) => {
    if (value === null || value === undefined || value === "") return;
    rows.push(`<div class="details-row"><span class="label">${label}</span><span class="value">${value}</span></div>`);
  };
  addRow("Модуляция", s.modulation);
  addRow("Число тонов", s.tone_count);
  addRow("Скорость (baud)", s.baud_rate != null ? s.baud_rate + " Бод" : null);
  addRow("Сдвиг/разнос тонов", s.shift_hz != null ? s.shift_hz + " Гц" : null);
  addRow("Полоса (спецификация)", s.bandwidth_hz != null ? s.bandwidth_hz + " Гц" : null);
  addRow("Битрейт", s.bitrate_bps != null ? s.bitrate_bps + " бит/с" : null);
  addRow("Кодирование", s.encoding);
  addRow("FEC / коррекция ошибок", s.fec);
  addRow("Интерливинг", s.interleaving);

  if (rows.length === 0) return "";
  return `<div class="details-desc" style="margin-top:6px; padding-top:6px; border-top:1px solid var(--border); font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--fg-dim);">Технический паспорт</div>`
    + rows.join("");
}

function selectSignal(id) {
  selectedSignal = signals.find(s => s.id === id);
  if (!selectedSignal) return;

  document.getElementById("signal-select").value = id;
  document.getElementById("freq-input").value = fmtFreqMHz(selectedSignal.recommended_freq_hz);
  document.getElementById("gain-input").value = selectedSignal.tx_vga_gain;
  document.getElementById("amp-toggle").checked = !!selectedSignal.amp_enable;
  document.getElementById("loop-toggle").checked = selectedSignal.loop !== false;

  const d = document.getElementById("details");
  const durationMin = Math.floor(selectedSignal.duration_sec / 60);
  const durationSec = Math.round(selectedSignal.duration_sec % 60);
  d.innerHTML = `
    <div class="details-row"><span class="label">Рекомендуемая частота</span><span class="value">${fmtFreqMHz(selectedSignal.recommended_freq_hz)} МГц</span></div>
    <div class="details-row"><span class="label">Длительность</span><span class="value">${durationMin}:${String(durationSec).padStart(2,"0")}</span></div>
    <div class="details-row"><span class="label">Частота дискретизации</span><span class="value">${(selectedSignal.sample_rate/1e6).toFixed(2)} МГц</span></div>
    <div class="details-row"><span class="label">Боковая полоса</span><span class="value">${selectedSignal.sideband.toUpperCase()}</span></div>
    <div class="details-row"><span class="label">Амплитуда файла</span><span class="value">${selectedSignal.gain}</span></div>
    ${buildSpecRows(selectedSignal)}
    <div class="details-desc">${selectedSignal.description || ""}</div>
  `;

  document.getElementById("play-btn").disabled = false;
  document.getElementById("preview-btn").disabled = false;
  resetWaterfall();
}

async function play() {
  if (!selectedSignal) return;
  const freqMHz = parseFloat(document.getElementById("freq-input").value);
  if (!freqMHz || freqMHz <= 0) {
    document.getElementById("status").className = "error";
    document.getElementById("status").textContent = "Некорректная частота.";
    return;
  }
  const freqHz = Math.round(freqMHz * 1e6);

  let gain = parseInt(document.getElementById("gain-input").value, 10);
  if (isNaN(gain)) gain = selectedSignal.tx_vga_gain;
  gain = Math.max(0, Math.min(47, gain));
  const amp = document.getElementById("amp-toggle").checked;
  const loop = document.getElementById("loop-toggle").checked;

  document.getElementById("status").className = "";
  document.getElementById("status").textContent = "Запуск...";
  document.getElementById("play-btn").disabled = true;

  const params = new URLSearchParams({
    freq_hz: freqHz,
    tx_vga_gain: gain,
    amp_enable: amp,
    loop: loop,
  });
  const res = await fetch(`/play/${selectedSignal.id}?${params}`, { method: "POST" });
  const data = await res.json();
  if (data.error) {
    document.getElementById("status").className = "error";
    document.getElementById("status").textContent = "Ошибка: " + data.error;
    document.getElementById("play-btn").disabled = false;
    return;
  }
  setConfigEnabled(false);
  connectWs();
  watchStatus();
}

async function stopPlayback() {
  await fetch("/stop", { method: "POST" });
  document.getElementById("status").className = "";
  document.getElementById("status").textContent = "Остановлено.";
  document.getElementById("play-btn").disabled = false;
  document.getElementById("stop-btn").disabled = true;
  document.getElementById("progress-wrap").classList.remove("visible");
  setConfigEnabled(true);
  if (statusPoll) { clearInterval(statusPoll); statusPoll = null; }
}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function updateProgress(data) {
  const wrap = document.getElementById("progress-wrap");
  if (data.phase !== "playing" || !data.duration_sec) {
    wrap.classList.remove("visible");
    return;
  }

  let cyclePos, cycleNum;
  if (data.cycle_position_sec != null && data.cycle_number != null) {
    // достоверная позиция — подтверждена реальным "Rewind" от hackrf_transfer
    cyclePos = data.cycle_position_sec;
    cycleNum = data.cycle_number;
  } else if (data.elapsed_sec != null) {
    // пока ни одного подтверждённого прохода не было (первый цикл длинного
    // сигнала, либо режим симуляции без hackrf_transfer) — оцениваем по времени
    cyclePos = data.elapsed_sec % data.duration_sec;
    cycleNum = Math.floor(data.elapsed_sec / data.duration_sec) + 1;
  } else {
    wrap.classList.remove("visible");
    return;
  }

  wrap.classList.add("visible");
  const fraction = Math.min(1, cyclePos / data.duration_sec);
  document.getElementById("progress-fill").style.width = (fraction * 100).toFixed(1) + "%";
  document.getElementById("progress-time").textContent = `${fmtTime(cyclePos)} / ${fmtTime(data.duration_sec)}`;
  document.getElementById("progress-cycle").textContent = data.loop ? `Цикл ${cycleNum}` : "";
}

function watchStatus() {
  if (statusPoll) clearInterval(statusPoll);
  statusPoll = setInterval(async () => {
    const res = await fetch("/status");
    const data = await res.json();
    if (data.last_error) {
      document.getElementById("status").className = "error";
      document.getElementById("status").textContent = "Ошибка: " + data.last_error;
      document.getElementById("play-btn").disabled = false;
      document.getElementById("stop-btn").disabled = true;
      document.getElementById("progress-wrap").classList.remove("visible");
      setConfigEnabled(true);
      clearInterval(statusPoll);
      statusPoll = null;
      return;
    }
    updateProgress(data);
    if (data.phase === "starting") {
      document.getElementById("status").className = "";
      document.getElementById("status").textContent = "Запуск...";
      document.getElementById("stop-btn").disabled = false;
    } else if (data.phase === "playing") {
      document.getElementById("status").className = "";
      document.getElementById("status").textContent = `Передача: ${data.playing} на ${fmtFreqMHz(data.freq_hz)} МГц`;
      document.getElementById("stop-btn").disabled = false;
    } else {
      document.getElementById("status").textContent = "Остановлено.";
      document.getElementById("play-btn").disabled = false;
      document.getElementById("stop-btn").disabled = true;
      setConfigEnabled(true);
      clearInterval(statusPoll);
      statusPoll = null;
    }
  }, 500);
}

function setConfigEnabled(enabled) {
  document.getElementById("signal-select").disabled = !enabled;
  document.getElementById("freq-input").disabled = !enabled;
  document.getElementById("gain-input").disabled = !enabled;
  document.getElementById("amp-toggle").disabled = !enabled;
  document.getElementById("loop-toggle").disabled = !enabled;
}

document.getElementById("play-btn").onclick = play;
document.getElementById("stop-btn").onclick = stopPlayback;

function connectWs() {
  if (ws) return;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/spectrum");
  ws.onmessage = (ev) => {
    const { freqs, db } = JSON.parse(ev.data);
    drawSpectrum(freqs, db);
    drawWaterfallRow(freqs, db);
  };
  ws.onclose = () => { ws = null; };
}

// Общие поля вокруг графиков — одинаковый отступ слева у спектра и
// водопада, чтобы частотная шкала визуально совпадала между ними
const MARGIN = { left: 48, right: 14, top: 14, bottom: 28 };
const AXIS_COLOR = "#1f9945";
const GRID_COLOR = "#0a2e14";
const BORDER_COLOR = "#145c28";
const BG_COLOR = "#010401";

function drawAxesFrame(ctx, w, h, xMin, xMax, yRange, xLabel, yLabel) {
  const plotW = w - MARGIN.left - MARGIN.right;
  const plotH = h - MARGIN.top - MARGIN.bottom;

  ctx.font = "11px Segoe UI, Arial";
  ctx.strokeStyle = GRID_COLOR;
  ctx.fillStyle = AXIS_COLOR;
  ctx.lineWidth = 1;

  // горизонтальные линии + подписи оси Y (только если задан диапазон — есть у спектра, нет у водопада)
  if (yRange) {
    const [yMin, yMax] = yRange;
    const yTicks = 4;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let i = 0; i <= yTicks; i++) {
      const val = yMax - (yMax - yMin) * i / yTicks;
      const y = MARGIN.top + (plotH * i / yTicks);
      ctx.beginPath();
      ctx.moveTo(MARGIN.left, y);
      ctx.lineTo(w - MARGIN.right, y);
      ctx.stroke();
      ctx.fillText(Math.round(val), MARGIN.left - 8, y);
    }
  }

  // вертикальные линии + подписи оси X (частота)
  const xTicks = 6;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let i = 0; i <= xTicks; i++) {
    const val = xMin + (xMax - xMin) * i / xTicks;
    const x = MARGIN.left + (plotW * i / xTicks);
    if (yRange) {
      ctx.beginPath();
      ctx.moveTo(x, MARGIN.top);
      ctx.lineTo(x, h - MARGIN.bottom);
      ctx.stroke();
    }
    ctx.fillText(val.toFixed(1), x, h - MARGIN.bottom + 6);
  }

  ctx.strokeStyle = BORDER_COLOR;
  ctx.strokeRect(MARGIN.left, MARGIN.top, plotW, plotH);

  ctx.fillStyle = AXIS_COLOR;
  ctx.textAlign = "right";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(xLabel, w - MARGIN.right, h - 4);
  if (yLabel) {
    ctx.save();
    ctx.translate(14, MARGIN.top + 4);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = "left";
    ctx.fillText(yLabel, 0, 0);
    ctx.restore();
  }
}

function drawSpectrumOn(ctx, canvas, freqs, db, dbRange) {
  const w = canvas.width, h = canvas.height;
  const plotW = w - MARGIN.left - MARGIN.right;
  const plotH = h - MARGIN.top - MARGIN.bottom;
  const [minDb, maxDb] = dbRange;
  const fMin = freqs[0], fMax = freqs[freqs.length - 1];

  ctx.clearRect(0, 0, w, h);
  drawAxesFrame(ctx, w, h, fMin, fMax, [minDb, maxDb], "кГц", "дБ");

  ctx.strokeStyle = "#33ff66";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#33ff66";
  ctx.shadowBlur = 6;
  ctx.beginPath();
  db.forEach((v, i) => {
    const x = MARGIN.left + (i / (db.length - 1)) * plotW;
    const y = MARGIN.top + plotH - ((v - minDb) / (maxDb - minDb)) * plotH;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.shadowBlur = 0;
}

const specCanvas = document.getElementById("spectrum");
const specCtx = specCanvas.getContext("2d");

function drawSpectrum(freqs, db) {
  const minDb = selectedSignal?.spectrum_db_min ?? -100;
  const maxDb = selectedSignal?.spectrum_db_max ?? 0;
  drawSpectrumOn(specCtx, specCanvas, freqs, db, [minDb, maxDb]);
}

const wfCanvas = document.getElementById("waterfall");
const wfCtx = wfCanvas.getContext("2d");
let wfFrameFreqs = null;

function dbToColor(v) {
  const minDb = selectedSignal?.spectrum_db_min ?? -100;
  const maxDb = selectedSignal?.spectrum_db_max ?? 0;
  const t = Math.max(0, Math.min(1, (v - minDb) / (maxDb - minDb)));
  // монохромная зелёная шкала (фосфорный терминал): тёмный фон -> яркий пик
  const lightness = 2 + t * 55;
  const saturation = 100 - t * 35;
  return `hsl(120, ${saturation}%, ${lightness}%)`;
}

function resetWaterfall() {
  const w = wfCanvas.width, h = wfCanvas.height;
  wfCtx.fillStyle = BG_COLOR;
  wfCtx.fillRect(0, 0, w, h);
  wfFrameFreqs = null;
}

function drawWaterfallRow(freqs, db) {
  const w = wfCanvas.width, h = wfCanvas.height;
  const plotW = w - MARGIN.left - MARGIN.right;
  const plotH = h - MARGIN.top - MARGIN.bottom;

  // рамка и подписи оси частоты — статичны, перерисовываем только
  // при смене диапазона (новый сигнал), а не на каждый кадр
  const freqKey = freqs[0] + "_" + freqs[freqs.length - 1];
  if (wfFrameFreqs !== freqKey) {
    wfCtx.fillStyle = BG_COLOR;
    wfCtx.fillRect(0, 0, w, h);
    drawAxesFrame(wfCtx, w, h, freqs[0], freqs[freqs.length - 1], null, "кГц", null);
    wfFrameFreqs = freqKey;
  }

  // скроллим только внутреннюю область графика, не трогая поля с подписями
  const imgData = wfCtx.getImageData(MARGIN.left, MARGIN.top, plotW, plotH - 1);
  wfCtx.putImageData(imgData, MARGIN.left, MARGIN.top + 1);

  const cellW = plotW / db.length;
  for (let i = 0; i < db.length; i++) {
    wfCtx.fillStyle = dbToColor(db[i]);
    wfCtx.fillRect(MARGIN.left + i * cellW, MARGIN.top, cellW + 1, 1);
  }
}

// --- Предпросмотр спектра (без передачи в HackRF) ---
let previewWs = null;
const previewCanvas = document.getElementById("preview-canvas");
const previewCtx = previewCanvas.getContext("2d");

function openPreview() {
  if (!selectedSignal) return;
  document.getElementById("preview-title").textContent = "Предпросмотр: " + selectedSignal.name;
  document.getElementById("preview-modal").classList.remove("hidden");

  const dbRange = [selectedSignal.spectrum_db_min ?? -100, selectedSignal.spectrum_db_max ?? 0];
  previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

  previewWs = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/preview/" + selectedSignal.id
  );
  previewWs.onmessage = (ev) => {
    const { freqs, db } = JSON.parse(ev.data);
    drawSpectrumOn(previewCtx, previewCanvas, freqs, db, dbRange);
  };
}

function closePreview() {
  document.getElementById("preview-modal").classList.add("hidden");
  if (previewWs) { previewWs.close(); previewWs = null; }
}

document.getElementById("preview-btn").onclick = openPreview;
document.getElementById("preview-close-btn").onclick = closePreview;
document.getElementById("preview-modal").addEventListener("click", (ev) => {
  if (ev.target.id === "preview-modal") closePreview();
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    closePreview();
    if (!document.getElementById("browse-close-btn").disabled) closeBrowse();
  }
});

// --- Импорт с диска сервера (файловый браузер) ---
let browsePath = "";

function closeBrowse() {
  document.getElementById("browse-modal").classList.add("hidden");
}

async function openBrowse(path) {
  document.getElementById("browse-modal").classList.remove("hidden");
  document.getElementById("browse-status").textContent = "";
  document.getElementById("browse-status").className = "import-status";
  document.getElementById("browse-path").textContent = "Загрузка...";
  document.getElementById("browse-list").innerHTML = "";
  document.getElementById("import-progress-wrap").classList.remove("visible");
  setBrowseLocked(false);

  let data;
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const res = await fetch("/import/browse?path=" + encodeURIComponent(path ?? ""), { signal: controller.signal });
    clearTimeout(timeoutId);
    data = await res.json();
  } catch (e) {
    document.getElementById("browse-path").textContent = "";
    document.getElementById("browse-status").className = "import-status error";
    document.getElementById("browse-status").textContent =
      (e.name === "AbortError" ? "Сервер не ответил за 10 секунд. " : "Не удалось получить список: ") + e;
    return;
  }

  if (data.error) {
    document.getElementById("browse-path").textContent = "";
    document.getElementById("browse-status").className = "import-status error";
    document.getElementById("browse-status").textContent = data.error;
    return;
  }

  browsePath = data.path;
  document.getElementById("browse-path").textContent = data.path || "(диски)";

  const list = document.getElementById("browse-list");
  list.innerHTML = "";

  if (data.parent !== null && data.parent !== undefined) {
    const up = document.createElement("div");
    up.className = "browse-item dir";
    up.innerHTML = `<span class="icon">↑</span><span class="name">.. (вверх)</span>`;
    up.onclick = () => openBrowse(data.parent);
    list.appendChild(up);
  }

  if (!data.entries || data.entries.length === 0) {
    const empty = document.createElement("div");
    empty.className = "browse-item";
    empty.style.color = "var(--fg-dim)";
    empty.style.cursor = "default";
    empty.textContent = "(пусто — ни папок, ни .tar-файлов)";
    list.appendChild(empty);
  }

  data.entries.forEach(entry => {
    const item = document.createElement("div");
    item.className = "browse-item " + (entry.is_dir ? "dir" : "tar");
    const sizeLabel = entry.size != null ? (entry.size / 1e6).toFixed(1) + " МБ" : "";
    item.innerHTML = `
      <span class="icon">${entry.is_dir ? "▸" : "◆"}</span>
      <span class="name">${entry.name}</span>
      <span class="size">${sizeLabel}</span>
    `;
    item.onclick = () => entry.is_dir ? openBrowse(entry.path) : importFromPath(entry.path);
    list.appendChild(item);
  });
}

let importPolling = null;

function setBrowseLocked(locked) {
  document.getElementById("browse-list").classList.toggle("locked", locked);
  document.getElementById("browse-close-btn").disabled = locked;
}

async function importFromPath(path) {
  const status = document.getElementById("browse-status");
  const progressWrap = document.getElementById("import-progress-wrap");
  status.className = "import-status";
  status.textContent = "";

  let data;
  try {
    const res = await fetch("/import-local?path=" + encodeURIComponent(path), { method: "POST" });
    data = await res.json();
  } catch (e) {
    status.className = "import-status error";
    status.textContent = "Не удалось начать импорт: " + e;
    return;
  }

  if (data.error) {
    status.className = "import-status error";
    status.textContent = "Ошибка импорта: " + data.error;
    return;
  }

  // импорт пошёл в фоне на сервере — блокируем окно и опрашиваем прогресс
  setBrowseLocked(true);
  progressWrap.classList.add("visible");
  document.getElementById("import-progress-fill").style.width = "0%";
  document.getElementById("import-progress-step").textContent = "Запуск...";
  document.getElementById("import-progress-count").textContent = "";

  if (importPolling) clearInterval(importPolling);
  importPolling = setInterval(async () => {
    let st;
    try {
      const res = await fetch("/import/status");
      st = await res.json();
    } catch (e) {
      return;  // временный сбой опроса — пробуем на следующем тике, окно не разблокируем
    }

    const frac = st.total > 0 ? st.done / st.total : 0;
    document.getElementById("import-progress-fill").style.width = (frac * 100).toFixed(0) + "%";
    document.getElementById("import-progress-step").textContent = st.step || (st.in_progress ? "Импорт..." : "");
    document.getElementById("import-progress-count").textContent = st.total > 0 ? `${st.done}/${st.total}` : "";

    if (st.in_progress) return;

    // импорт завершился (успешно или с ошибкой)
    clearInterval(importPolling);
    importPolling = null;
    setBrowseLocked(false);
    progressWrap.classList.remove("visible");

    if (st.error) {
      status.className = "import-status error";
      status.textContent = "Ошибка импорта: " + st.error;
      return;
    }

    const imported = st.result?.imported;
    if (!Array.isArray(imported)) {
      status.className = "import-status error";
      status.textContent = "Неожиданный ответ сервера: " + JSON.stringify(st.result);
      return;
    }

    const names = imported.map(s => s.name + (s.updated ? " (обновлён)" : " (новый)"));
    status.className = "import-status ok";
    status.textContent = "Импортировано: " + names.join(", ");

    await loadSignals();
  }, 400);
}

document.getElementById("import-local-btn").onclick = () => openBrowse("");
document.getElementById("browse-close-btn").onclick = () => { if (!document.getElementById("browse-close-btn").disabled) closeBrowse(); };
document.getElementById("browse-modal").addEventListener("click", (ev) => {
  if (ev.target.id === "browse-modal" && !document.getElementById("browse-close-btn").disabled) closeBrowse();
});

loadSignals();
</script>
